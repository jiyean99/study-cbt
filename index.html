<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네트워크관리사 2급 기출문제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
        }

        .correct-opt {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
        }

        .incorrect-opt {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
        }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">

    <nav class="sticky-nav border-b border-gray-200 p-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full md:w-2/3">
                <div class="flex justify-between text-xs font-bold mb-1">
                    <span id="progress-text" class="text-blue-600">진행도: 0 / 0</span>
                    <span id="score-text" class="text-green-600">진행률: 0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 w-0"></div>
                </div>
            </div>
            <button id="reset-trigger"
                class="w-full md:w-auto bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-bold transition-transform active:scale-95">
                학습 내역 초기화
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 py-8">
        <div id="quiz-list" class="space-y-8">
            <!-- Questions rendered here -->
        </div>
    </main>
    <script src="./index.js"></script>
</body>

</html>
